[[plugins]]
  package = "netlify-plugin-image-optim"

[build]
  publish = "dist"   # ← اپنا build output فولڈر

[[redirects]]
  from = "/images/full/:file"
  to = "/.netlify/images?url=/images/:file"
  status = 200

[[redirects]]
  from = "/images/:width/:file"
  to = "/.netlify/images?url=/images/:file&width=:width"
  status = 200

[images]
  remote_images = ["https://my-images.com/.*"]  # optional: اگر آپ باہر کے URLs optimize کرنا چاہتے ہیں